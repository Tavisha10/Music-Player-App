<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign up — My Music</title>
  <!-- local stylesheet (development) -->
  <link rel="stylesheet" href="/mnt/data/style.css">
  <style>
    /* Small overrides to match login card but keep standalone if style.css isn't loaded */
    body { margin:0; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background: linear-gradient(135deg,#0e1525,#090f1a); color:#e6eef4; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .signup-card { background: rgba(255,255,255,0.03); padding:28px; border-radius:14px; width:420px; box-shadow:0 12px 30px rgba(0,0,0,0.5); }
    .signup-card h2 { margin:0 0 12px 0; text-align:center; font-weight:700; }
    .field { margin-top:12px; }
    label { display:block; font-size:13px; color:#9aa5b1; margin-bottom:6px; }
    input[type="text"], input[type="email"], input[type="password"], input[type="file"] { width:100%; padding:10px 12px; border-radius:8px; border:none; background:#121826; color:#e6eef4; font-size:14px; }
    .row { display:flex; gap:10px; }
    .half { flex:1; }
    .btn-primary { width:100%; margin-top:18px; background:#5bbb95; border:none; padding:12px; border-radius:10px; color:#071019; font-weight:700; cursor:pointer; }
    .muted { color:#9aa5b1; font-size:13px; text-align:center; margin-top:12px; }
    .alt-link { color:#5bbb95; text-decoration:none; font-weight:600; }
    .small-hint { font-size:12px; color:#7f8b94; margin-top:6px; }
    .avatar-preview { width:64px; height:64px; border-radius:8px; object-fit:cover; border:1px solid rgba(255,255,255,0.04); }
  </style>
</head>
<body>
  <div class="signup-card">
    <h2>Create your account</h2>

    <!-- Use enctype if you allow profile image uploads -->
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="field">
        <label for="id_username">Username</label>
        <input type="text" id="id_username" name="username" required placeholder="Pick a username" />
      </div>

      <div class="field">
        <label for="id_email">Email</label>
        <input type="email" id="id_email" name="email" required placeholder="you@example.com" />
      </div>

      <div class="row">
        <div class="field half">
          <label for="id_password1">Password</label>
          <input type="password" id="id_password1" name="password1" required placeholder="Create a password" />
          <div class="small-hint">At least 8 characters</div>
        </div>

        <div class="field half">
          <label for="id_password2">Confirm Password</label>
          <input type="password" id="id_password2" name="password2" required placeholder="Repeat password" />
        </div>
      </div>

      <div class="row" style="align-items:center; margin-top:12px;">
        <div style="flex:1;">
          <label for="id_avatar">Profile image (optional)</label>
          <input type="file" id="id_avatar" name="avatar" accept="image/*" />
          <div class="small-hint">PNG/JPG, max 2MB</div>
        </div>
        <div style="width:80px; text-align:center;">
          <!-- preview placeholder (JS can populate) -->
          <img id="avatarPreview" class="avatar-preview" src="/mnt/data/2fb211e3-466d-44a1-b46a-b270610fbdab.png" alt="avatar preview" />
        </div>
      </div>

      <button type="submit" class="btn-primary">Create account</button>

      <div class="muted">
        By creating an account you agree to our <a class="alt-link" href="#">Terms</a> & <a class="alt-link" href="#">Privacy</a>.
      </div>

      <div class="muted" style="margin-top:14px;">Already have an account? <a class="alt-link" href="{% url 'login' %}">Log in</a></div>
    </form>
  </div>

  <script>
    // small preview helper: show selected avatar image before upload
    const fileInput = document.getElementById('id_avatar');
    const preview = document.getElementById('avatarPreview');
    if (fileInput && preview) {
      fileInput.addEventListener('change', (e) => {
        const f = e.target.files && e.target.files[0];
        if (f) {
          const url = URL.createObjectURL(f);
          preview.src = url;
        } else {
          preview.src = '/mnt/data/2fb211e3-466d-44a1-b46a-b270610fbdab.png';
        }
      });
    }
  </script>
</body>
</html>
